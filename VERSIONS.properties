# =============================================================================
# VERSIONS.properties -- the single source of truth for Forbric's target versions.
#
# NOTHING else in this repository may hardcode a target Minecraft / loader version.
#   * Gradle builds read this through gradle/forbric-versions.gradle (apply from).
#   * The Python tooling reads it in tools/dev.py.
#   * The installers carry it into their jars as forbric-versions.properties.
# Bump a version HERE and only here.
#
# Syntax is Java .properties: `forbric.<area>.<name>=value`, `#` begins a comment.
# =============================================================================

# --- Game + ecosystem targets -------------------------------------------------
forbric.minecraft.version=1.20.1

# traditional MinecraftForge, in its <mc>-<fml> coordinate form.
forbric.forge.version=1.20.1-47.4.0

# Fabric Loader: the upstream release the forbric-loader substrate patches apply to.
forbric.fabric.loader=0.16.10

# Fabric API for the target Minecraft version.
forbric.fabric.api=0.92.6+1.20.1

# Team Reborn Energy (energy-bridge compile/test pin; never bundled).
forbric.energy.version=5.0.0

# Forge's SRG member-name source for 1.20.1: MCPConfig, whose coordinate the Forge -userdev config.json
# carries in its "mcp" field. Forge production speaks Mojmap class names + SRG member names, and those
# m_/f_ ids cannot be derived from Mojang official + Fabric intermediary; they live only here. It is
# downloaded locally at build/run time and is never committed to this repository or bundled into a jar --
# the same stance Forbric takes for Minecraft itself. See forbric-loader/MAPPINGS.md.
forbric.forge.mcpconfig=de.oceanlabs.mcp:mcp_config:1.20.1-20230612.114412@zip
forbric.forge.srg.entry=config/joined.tsrg

# jline the dedicated-server console needs. 1.20.1's version JSON does not list it (the server bundler carries
# its own), so the dev launcher fetches it explicitly; 1.20.1 ships 3.23.0.
forbric.console.jline.version=3.23.0

# --- Runtime model ------------------------------------------------------------
# 1.20.1 is obfuscated. The kernel's game-side source is written against Mojang official ("named")
# names, so the game runs in the named namespace: the Forge SRG base is remapped to named once at
# install time, and the SRG carrier/guest mods are remapped SRG -> named at runtime. This matches the
# old 26.2 "named" model, which is why the source needs no class-name rewrite.
forbric.runtime.namespace=named

# Launcher profile the installer writes (versions/<name>/<name>.json).
forbric.profile.name=1.20.1-forbric

# --- Upstream coordinates / URLs ----------------------------------------------
forbric.mojang.manifest=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json
forbric.fabric.maven=https://maven.fabricmc.net
forbric.forge.maven=https://maven.minecraftforge.net
forbric.central.maven=https://repo1.maven.org/maven2

# intermediary-<version>-v2.jar; {version} is replaced with forbric.minecraft.version.
forbric.intermediary.url=https://maven.fabricmc.net/net/fabricmc/intermediary/{version}/intermediary-{version}-v2.jar

# Mojang ProGuard mappings have no stable URL: resolve the target version through
# forbric.mojang.manifest and take downloads.client_mappings.url (client.txt).
