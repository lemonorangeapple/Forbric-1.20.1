org.gradle.jvmargs=-Xmx1536M -Duser.language=en -Duser.country=US

group = net.forbric
description = Forbric Kernel — a sovereign unified Minecraft mod loader (Fabric + Forge + NeoForge)
url = https://example.invalid/forbric

# Pure-bytecode / mapping / data machinery reused from the forbric-loader substrate (Apache-2.0).
# Keep aligned with forbric-loader/gradle.properties so the shared toolchain matches.
#
# Java 17 confirmation (port item 8): every artifact below was checked to be loadable on a Java 17 JVM
# (class-file major <= 61). ASM 9.x reads 1.20.1's Java 17 classes; sponge-mixin keeps Mixin 0.8.7, which is
# the ABI Fabric Loader 0.16.10 (the 1.20.1-era loader) pins as 0.15.4+mixin.0.8.7 -- same Mixin, newer patch.
asm_version = 9.10.1
mixin_version = 0.17.3+mixin.0.8.7
mixin_extras_version = 0.5.4
sat4j_version = 2.3.6
tiny_remapper_version = 0.14.0
class_tweaker_version = 0.3.0-beta.2
mapping_io_version = 0.7.1

night_config_version = 3.8.1

junit_version = 5.9.2
